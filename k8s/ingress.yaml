apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: micronaut-demo
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: micronaut-demo.local
      http:
        paths:
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: micronaut-demo
                port:
                  number: 80