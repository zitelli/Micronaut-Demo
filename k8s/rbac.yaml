apiVersion: v1
kind: ServiceAccount
metadata:
  name: micronaut-demo
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: micronaut-demo
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "configmaps", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: micronaut-demo
  namespace: default
subjects:
  - kind: ServiceAccount
    name: micronaut-demo
    namespace: default
roleRef:
  kind: Role
  name: micronaut-demo
  apiGroup: rbac.authorization.k8s.io
