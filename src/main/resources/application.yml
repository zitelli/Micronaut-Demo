micronaut:
  application:
    name: micronaut-demo
  server:
    port: 8080
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins:
            - ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
          allowed-methods:
            - GET
            - POST
            - PUT
            - DELETE
    netty:
      compression:
        enabled: false

  security:
    enabled: true
    authentication: bearer
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: "${JWT_SECRET:thisIsASecretKeyForJWTGeneration}"
    endpoints:
      login:
        enabled: true
    intercept-url-map:
      - pattern: /swagger/**
        access:
          - isAnonymous()
      - pattern: /swagger-ui/**
        access:
          - isAnonymous()
      - pattern: /openapi/**
        access:
          - isAnonymous()

    # NOTE: micronaut.security.endpoints.oauth was removed - it requires the
    # io.micronaut.security:micronaut-security-oauth2 dependency, which isn't
    # on the classpath. Enabling it with no OAuth2 client configured has no
    # effect and is misleading; add the dependency + client config if OAuth2
    # login is actually needed.
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        step: 1m
  openapi:
    enabled: true
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
  aot:
    logback:
      xml:
        to:
          java:
            enabled: true

datasources:
  default:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${JDBC_USER:postgres}
    password: ${JDBC_PASSWORD:password}
    driver-class-name: ${JDBC_DRIVER:org.postgresql.Driver}
    schema-generate: ${JDBC_SCHEMA_GENERATE:CREATE_DROP}
    dialect: ${JDBC_DIALECT:POSTGRES}
    pool:
      max-size: 10

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  default:
    topic:
      name: "order-events"
  producers:
    default:
      key.serializer: org.apache.kafka.common.serialization.StringSerializer
      value.serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      max.block.ms: 10000
      request.timeout.ms: 5000

kubernetes:
  client:
    namespace: ${KUBERNETES_NAMESPACE:default}
  discovery:
    enabled: true
  config:
    enabled: true
    sources:
      - configMap:
          name: micronaut-demo-config

scheduled:
  tasks:
    cleanup:
      cron: "0 0 2 * * ?"  # 2 AM daily

endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
  info:
    enabled: true
    sensitive: false
  prometheus:
    enabled: true
    sensitive: false