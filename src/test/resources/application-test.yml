micronaut:
  security:
    enabled: true

kubernetes:
  client:
    discovery:
      enabled: false
  discovery:
    enabled: false
  config:
    enabled: false

kafka:
  enabled: false

datasources:
  default:
    url: "jdbc:h2:mem:testDb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE"
    driver-class-name: org.h2.Driver
    dialect: H2
    schema-generate: CREATE_DROP
    pool:
      max-size: 10

logger:
  levels:
    root: DEBUG